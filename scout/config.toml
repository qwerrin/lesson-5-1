# scout の設定。`cli.py` が**接続を開く前に**全部確かめる（知らない鍵も誤りにする）。
#
# 取得元ごとに `query` の意味が違う（DESIGN 4-1）——共通の抽象を被せると両方の説明が嘘になる。
#   qiita … 検索式（`tag:` など）。期間は cli が `created:>=` を足す
#   zenn  … トピックのスラッグ（zenn.dev/topics/<ここ>/feed）

# 設定ファイルの場所から解決する。vault の 01_Inbox（このリポジトリは vault の 03_Work/dev/ にある）。
# **クローンには無い**ので、その場合は `--inbox` で差し替える。
inbox = "../../../../01_Inbox"

# U4 で疎通を取ったモデル（`common/gemini_client.DEFAULT_MODEL` と同じ）。
model = "gemini-3.5-flash-lite"

# 要約してよい取得元。**本文が取れる Qiita だけ**（2-4：照合できないものは要約しない）。
summarizable = ["qiita"]

[profile]
# **点は関心で付ける**（2026-10-04・DESIGN U22）。以前の `ClaudeCode` タグと `Claude Code` は、
# 取得の時点で全員に付いているので点が平らになり、いいね（ほぼ全部 0〜1）で選ばれていた。
# 取得の絞り込みは sources の query（tag:ClaudeCode）がやるので、ここから外しても集める記事は変わらない。
# 語はタイトルの部分一致——`mod` だと `Plan Mode` に当たるので `mods` にしてある。
tags = ["ContextEngineering", "コンテキスト管理", "MCP", "AnthropicSkills", "SKILLS"]
keywords = ["CLAUDE.md", "memory", "記憶", "引き継ぎ", "コンテキスト", "文脈", "MCP", "mods", "スキル", "skill"]
mute_tags = []
mute_keywords = []
# 要約へ回す上限。`max_calls`（既定 10）より大きくすると設定の誤りになる。
cap = 10

[[sources]]
name = "qiita"
kind = "qiita"
query = "tag:ClaudeCode"
# **1回で取れる上限（100）にしておく。** `fetch` はページをめくらないので、
# 「まだ先がある」回は日付を進めず、しかも残りは取れない＝毎日「注意」のまま止まる。
# 2026-10-03 の実測で、tag:ClaudeCode は2日分で20件を超えていた（DESIGN U18）。
# 要約は profile.cap で10件までなので、上げても Gemini の課金は増えない。
limit = 100

[[sources]]
name = "zenn"
kind = "zenn"
query = "claudecode"
limit = 20
